# Fast local hygiene checks. CI (.github/workflows/ci.yml) is authoritative
# for linting, type-checking, and tests — this config catches formatting and
# whitespace issues before they reach CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.0.3
    hooks:
      - id: editorconfig-checker
        alias: ec

  # markdownlint-cli2, matching the CI job's action, so both read
  # .markdownlint-cli2.yaml. Previously this hook passed `--disable MD013
  # MD033` while CI passed nothing, so CI failed on rules that had already been
  # ruled out locally — and had never passed since the initial scaffold.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable}}"]

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (conventional commits)
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
